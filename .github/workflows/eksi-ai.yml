name: eksi-ai
on:
  push:
    paths: ["eksi-ai/**", ".github/workflows/eksi-ai.yml"]
  pull_request:
    paths: ["eksi-ai/**", ".github/workflows/eksi-ai.yml"]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: eksi, POSTGRES_PASSWORD: eksi, POSTGRES_DB: eksi_ai_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U eksi" --health-interval 5s --health-retries 10
    defaults:
      run: { working-directory: eksi-ai/backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: eksi-ai/frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
