name: Build phone demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Verify and build demo APK
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build apk --release --target-platform android-arm64,android-arm --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: CERAMICA-Android-demo
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Package iPhone web demo
        run: |
          cd apps/phone-demo
          zip -r "$RUNNER_TEMP/CERAMICA-iPhone-web-demo.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: CERAMICA-iPhone-web-demo
          path: ${{ runner.temp }}/CERAMICA-iPhone-web-demo.zip
