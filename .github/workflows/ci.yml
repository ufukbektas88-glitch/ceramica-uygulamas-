name: Legacy commerce checks
on:
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: ceramica
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ceramica
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U ceramica'
          --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ceramica:ci-only-password@127.0.0.1:5432/ceramica
      DEMO_ADMIN_PASSWORD: ci-only-admin-password-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: touch .env
      - run: npm run db:generate && npm run db:migrate && npm run db:seed
      - run: npm run typecheck && npm run build && npm test
      - run: |
          node apps/api/dist/main.js > /tmp/ceramica-api.log 2>&1 &
          npm run test:integration
