name: Build CERAMICA showroom
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Verify and build catalog APK
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build apk --release --target-platform android-arm64,android-arm --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: CERAMICA-Android-katalog
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Build optional web catalog
        working-directory: apps/mobile
        run: flutter build web --release --no-web-resources-cdn --no-pub
      - name: Package catalog artifacts
        run: |
          CERAMICA_OUTPUT_DIR="$RUNNER_TEMP" python3 scripts/package-showroom.py
      - uses: actions/upload-artifact@v4
        with:
          name: CERAMICA-web-katalog
          path: ${{ runner.temp }}/CERAMICA-web-katalog.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CERAMICA-iOS-kaynak
          path: ${{ runner.temp }}/CERAMICA-iOS-kaynak.zip
