services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eksi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlanmalı}
      POSTGRES_DB: eksi_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eksi -d eksi_ai"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://eksi:${POSTGRES_PASSWORD}@db:5432/eksi_ai
      PANEL_TOKEN: ${PANEL_TOKEN:?PANEL_TOKEN .env içinde tanımlanmalı}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # dışarıya açmak için önüne TLS sonlandıran bir ters vekil koyun

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://eksi:${POSTGRES_PASSWORD}@db:5432/eksi_ai
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
